name: Validate Addons Catalog

on:
  pull_request:
    paths:
      - 'docs/addons-catalog.json'
  push:
    branches: [main]
    paths:
      - 'docs/addons-catalog.json'
      - 'scripts/validate-addons-catalog.cjs'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: validate addons catalog
        run: node scripts/validate-addons-catalog.cjs
