name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/grimoire-debug.apk
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
            cp app/build/outputs/apk/debug/app-debug.apk release-output/grimoire-${VERSION}.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grimoire-android-apk
          path: release-output/*.apk
          retention-days: 30

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          files: release-output/*.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Grimoire {0} (Android)', github.ref_name) || 'Grimoire Android (Dernière version)' }}
          body: |
            ### 🐉 Grimoire Android

            Application mobile & tablette pour Maîtres du Jeu TTRPG (Table Virtuelle VTT, Initiative & Combat, Grimoire Markdown, Compendium Herboriste, Lanceur de Dés & Ambiances).

            #### 📱 Téléchargement & Installation :
            1. Téléchargez le fichier `.apk` ci-dessous sur votre smartphone ou tablette Android.
            2. Ouvrez le fichier téléchargé pour installer l'application (autorisez l'installation depuis cette source si demandé par Android).
            3. Lancez Grimoire et profitez de votre table virtuelle !
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
